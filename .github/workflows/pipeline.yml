name: Rebuild data

# nflverse publishes cleaned play-by-play nightly; Thursday's pull is the
# cleanest of the week because stat corrections have landed by then.
on:
  schedule:
    - cron: "30 10 * * *" # 06:30 ET daily
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to build (space separated). Blank = default history."
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build
        working-directory: pipeline
        run: |
          if [ -n "${{ inputs.seasons }}" ]; then
            python -m nflx.cli build --seasons ${{ inputs.seasons }}
          else
            python -m nflx.cli build
          fi

      - name: Summarize
        run: |
          echo "### Data build" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh data/parquet >> $GITHUB_STEP_SUMMARY
          cat data/json/manifest.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: nflx-data
          path: data/
          retention-days: 7

  # Vercel builds the site from the repo; it does not need the data, because the
  # site reads parquet over HTTPS from this Release at request time. Publishing is
  # therefore the only deploy step here — Vercel redeploys on its own from git.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A fork has no write token and must not publish to this repo's releases.
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nflx-data
          path: data/

      - name: Publish data store to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-data.mjs

      - name: Summarize
        run: |
          echo "### Data published" >> $GITHUB_STEP_SUMMARY
          echo "Tag: ${NFLX_DATA_TAG:-data-latest}" >> $GITHUB_STEP_SUMMARY
          echo "Assets: $(find data -name '*.parquet' -o -name '*.json' | wc -l)" >> $GITHUB_STEP_SUMMARY
